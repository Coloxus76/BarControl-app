
name: Generar APK BarControl

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Configurar aplicacion Android
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.coloxus76.barcontrol',
            appName: 'BarControl',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Compilar React
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar proyecto
        run: npx cap sync android

      - name: Generar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: BarControl-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
